#typeDefs to register a user
union createScheduleResult = SchedulePlan | GraphqlError

input createScheduleInput {
  userId: String!
  Year: Int!
  Month: String!

  # FRONT END WILL HANDLE IF NOT SCHEDULE FOR 5 DAYS IS CREATED
  weekday: Int! # 1 - 5 represents Mo - Fr
  startShift: String!
  endShift: String!
  employeeIsAbsent: Boolean!
  absentReason: CheckIfDayOff!

}

type Mutation {
  createSchedule(
    createScheduleInput: createScheduleInput!
  ): createScheduleResult!
}

# Steps to create schedule:

# 1 step: choose year and month, preset current year and month, get current day,
# user choose date, disable days which are in the past

# user chooses day in the future
# user types startTime and endTime of this day, save
